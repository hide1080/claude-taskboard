name: Claude PR Review
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      issues: write
      id-token: write # OIDC認証に必要
    steps:
      - uses: actions/checkout@v6
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          display_report: true      # 最終出力を Job Summary に表示
          prompt: |
            1. `gh pr diff ${{ github.event.pull_request.number }}` で差分を取得する
            2. バグ・セキュリティ・パフォーマンスの観点でレビューし、指摘を箇条書きにまとめる
            3. レビュー結果は `gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body "<レビュー内容>"` で必ず PR に投稿する。投稿せずに終了してはならない。
            4. 指摘がなくても「指摘事項なし」と投稿する
            5. コマンドが失敗した場合は、エラーメッセージを最終出力にそのまま含める
          claude_args: |
            --max-turns 15
            --permission-mode default
            --allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"