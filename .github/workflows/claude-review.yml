name: Claude PR Review
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "src/**"
      - "!src/**/*.test.ts" # テストファイルは除外
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true # 同一グループのワークフローが実行中ならキャンセル

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      id-token: write # OIDC認証に必要
    steps:
      - uses: actions/checkout@v6
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          display_report: true      # 最終出力を Job Summary に表示
          # show_full_output: true    # 調査中だけ有効にする
          prompt: |
            1. `gh pr diff ${{ github.event.pull_request.number }}` で差分を取得する
            2. バグ・セキュリティ・パフォーマンスの観点でレビューする
            3. 指摘は 1 件ずつ `mcp__github_inline_comment__create_inline_comment` で、差分の該当ファイル・該当行にインラインコメントとして投稿する。具体的に書き、可能なら修正案も添える。差分に含まれない行には付けない。同じ指摘を重複して投稿しない。
            4. 最後に総評を `gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body "<総評>"` で PR に投稿する。投稿せずに終了してはならない。
            5. 指摘がなくても、総評として「指摘事項なし」と投稿する
            6. コマンドやツールが失敗した場合は、エラーメッセージを最終出力にそのまま含める
          claude_args: |
            --max-turns 10
            --permission-mode default
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment *),Bash(gh pr diff *),Bash(gh pr view *)"